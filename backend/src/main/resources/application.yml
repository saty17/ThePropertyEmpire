server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/property_empire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:ThePropertyEmpireSecretKeyForJWTTokenGeneration2024VeryLongSecretKey}
    expiration: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@thepropertyempire.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:TPE Admin}
