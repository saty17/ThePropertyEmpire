server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/property_empire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:ThePropertyEmpireSecretKeyForJWTTokenGeneration2024VeryLongSecretKey}
    expiration: 900000
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
  admin:
    email: ${ADMIN_EMAIL:umyanoob@gmail.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:TPE Admin}
